<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شات ريمه - أبو جواس</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --card-bg: #0b1124; 
            --btn-blue-dark: #050a17; 
            --btn-blue-light: #101b3d; 
            --gold-border: #ff9900; 
            --gold-glow: rgba(255, 153, 0, 0.7); 
            --text-main: #e2e8f0; 
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --bg-light: #ffffff;
            --text-dark: #2d3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--card-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden; 
        }

        .phone-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            height: 100vh;
            height: 100dvh;
            background: var(--card-bg); 
            overflow: hidden;
        }

        .phone-inner {
            background: var(--card-bg);
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%; 
            overflow: hidden;
        }

        #loadingScreen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--card-bg); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; gap: 15px; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255, 153, 0, 0.2); border-top: 4px solid var(--gold-border); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: var(--gold-border); font-size: 14px; font-weight: bold; }

        #mainApp { display: none; flex-direction: column; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        .top-nav {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg); padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 153, 0, 0.2); flex-shrink: 0;
        }
        
        .top-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .top-avatar { width: 35px; height: 35px; border-radius: 50%; background: var(--btn-blue-light); border: 1px solid var(--gold-border); display: flex; justify-content: center; align-items: center; color: var(--gold-border); overflow: hidden; }
        .top-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .top-name { color: var(--text-main); font-size: 14px; font-weight: 700; }
        
        .menu-toggle { color: var(--gold-border); font-size: 22px; cursor: pointer; }

        .app-section { flex: 1; overflow-y: auto; display: flex; flex-direction: column; color: var(--text-dark); background: var(--bg-light); position: relative; }
        .empty-state { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: #a0aec0; font-size: 14px; font-weight: 600; }

        .chat-list-item {
            display: flex; align-items: center; padding: 12px 15px;
            border-bottom: 1px solid #edf2f7; cursor: pointer;
            background: #fff; transition: background 0.2s; position: relative;
        }
        .chat-list-item:active { background: #f8fafc; }
        
        .chat-avatar-wrapper { position: relative; margin-left: 12px; flex-shrink: 0; }
        .chat-avatar { width: 45px; height: 45px; border-radius: 50%; background: #e2e8f0; display: flex; justify-content: center; align-items: center; color: #4a5568; font-weight: bold; font-size: 18px; }
        
        .status-dot { position: absolute; bottom: 0; left: 0; width: 13px; height: 13px; border-radius: 50%; border: 2px solid #fff; }
        .status-dot.online { background-color: var(--success); }
        .status-dot.offline { background-color: #cbd5e1; }

        .chat-info { display: flex; flex-direction: column; flex: 1; }
        .chat-name-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .chat-name { font-size: 14px; font-weight: 700; color: #2d3748; }

        .bottom-nav {
            display: none; justify-content: space-around; align-items: center;
            background: #050a17; border-top: 1px solid var(--gold-border);
            padding: 8px 0; width: 100%; flex-shrink: 0; 
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-sub); cursor: pointer; font-size: 9px; font-weight: 700; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--gold-border); }

        #roomChatPage {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #e5e7eb; z-index: 100; flex-direction: column; overflow: hidden; 
        }
        .room-chat-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: var(--card-bg); color: white;
            border-bottom: 1px solid var(--gold-border); flex-shrink: 0; position: relative;
        }
        .room-chat-header h2 { font-size: 14px; font-weight: 700; color: var(--gold-border); }
        .chat-controls button { background: transparent; border: none; color: white; font-size: 18px; cursor: pointer; }

        .room-chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { background: #ffffff; padding: 8px 12px; border-radius: 15px; max-width: 80%; align-self: flex-start; font-size: 13px; color: #2d3748; }
        .msg-bubble.my-msg { background: var(--gold-border); color: #000; align-self: flex-end; }

        .room-chat-input { display: flex; padding: 10px; background: #ffffff; border-top: 1px solid #e2e8f0; gap: 10px; flex-shrink: 0; }
        .room-chat-input input { flex: 1; padding: 10px 15px; border: 1px solid #cbd5e1; border-radius: 20px; outline: none; font-size: 12px; }
        .room-chat-input button { background: var(--card-bg); color: var(--gold-border); border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: flex; justify-content: center; align-items: center; }

        #loginCard, #registerCard {
            padding: 20px; display: flex; flex-direction: column; width: 100%; height: 100%; background: var(--card-bg);
        }
        #registerCard { display: none; }
        .title-container { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 20px; margin-bottom: 15px; width: 100%; }
        .title-row { display: flex; justify-content: space-between; width: 100%; gap: 6px; }
        .glass-box { height: 32px; display: flex; justify-content: center; align-items: center; background: linear-gradient(180deg, var(--btn-blue-light) 0%, var(--btn-blue-dark) 100%); border: 1px solid var(--gold-border); box-shadow: 3px 3px 8px rgba(0,0,0,0.8); }
        .box-chat { flex: 1; border-radius: 20px 5px 20px 20px; }
        .box-dardasha { flex: 1; border-radius: 5px 20px 20px 20px; }
        .box-reema { width: 80%; border-radius: 20px 20px 20px 5px; }
        .app-title { font-family: 'Amiri', serif; font-size: 14px; font-weight: 700; color: #ffffff; display: flex; align-items: center; justify-content: center; height: 100%; }
        .title-reema { font-size: 16px; letter-spacing: 1px; }
        
        .top-icon { width: 65px; height: 65px; border-radius: 50%; background: var(--card-bg); margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; border: 2px solid var(--gold-border); font-size: 28px; color: var(--gold-border); }
        
        .bottom-section { margin-top: auto; display: flex; flex-direction: column; width: 100%; padding-bottom: 10px; }
        .input-group { position: relative; margin-bottom: 10px; } 
        .input-group i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--gold-border); font-size: 12px; z-index: 2; }
        .input-group input { width: 100%; height: 38px; padding: 0 35px 0 12px; border-radius: 15px 5px 15px 5px; background: linear-gradient(180deg, var(--btn-blue-light) 0%, var(--btn-blue-dark) 100%); color: white; font-size: 12px; font-weight: 700; border: 1px solid var(--gold-border); outline: none; }
        .input-group input::placeholder { color: #94a3b8; font-weight: 600; font-size: 11px; }
        
        .options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 10px; color: var(--text-sub); }
        .forgot-pass { color: #60a5fa; text-decoration: none; font-weight: 600; cursor: pointer; }

        .btn-main, .btn-secondary { width: 100%; height: 40px; border-radius: 15px 5px 15px 5px; background: linear-gradient(180deg, #1a2f66 0%, var(--btn-blue-dark) 100%); color: white; font-size: 13px; font-weight: 900; cursor: pointer; margin-bottom: 8px; display: flex; justify-content: center; align-items: center; gap: 6px; border: 1px solid var(--gold-border); }
        .btn-main:active, .btn-secondary:active { transform: scale(0.98); opacity: 0.9; }
        .btn-main i { color: var(--gold-border); font-size: 13px; }
        .btn-secondary { height: 35px; font-size: 11px; }
        
        .bottom-texts { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
        .bottom-dua { color: #a78bfa; font-size: 10px; font-weight: 700; margin: 0 0 3px 0; }
        .developer-name { font-size: 9px; color: var(--text-sub); font-weight: 600; margin: 0; }
        .developer-name span { color: var(--gold-border); font-weight: bold; }
        .divider { display: flex; align-items: center; text-align: center; color: var(--text-sub); font-size: 8px; margin: 5px 0; font-weight: 600; width: 100%; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .divider span { padding: 0 5px; }
        .phone-number { display: flex; justify-content: center; align-items: center; gap: 4px; font-size: 9px; font-weight: 700; color: var(--text-main); direction: ltr; text-decoration: none; }
        .whatsapp-icon { color: #25D366; font-size: 11px; }

        #sideMenu { position: absolute; top: 0; right: -100%; width: 80%; height: 100%; background: #ffffff; z-index: 50; transition: right 0.3s ease; display: flex; flex-direction: column; box-shadow: -5px 0 15px rgba(0,0,0,0.8); }
        #sideMenu.open { right: 0; }
        #menuOverlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 40; }
        
        .side-menu-header { background: var(--card-bg); padding: 20px; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--gold-border); }
        .side-menu-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--btn-blue-light); border: 2px solid var(--gold-border); display: flex; justify-content: center; align-items: center; font-size: 24px; color: var(--gold-border); overflow: hidden; }
        .side-menu-info h3 { color: var(--text-main); font-size: 16px; margin-bottom: 2px; }
        .side-menu-info p { color: var(--text-sub); font-size: 11px; }
        
        .side-menu-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; padding-bottom: 20px; }
        .menu-item-side { display: flex; align-items: center; gap: 15px; padding: 15px 20px; color: #2d3748; font-size: 13px; font-weight: 600; border-bottom: 1px solid #e2e8f0; cursor: pointer; }
        .menu-item-side i { font-size: 18px; width: 25px; text-align: center; color: var(--gold-border); }

        .full-page { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--card-bg); z-index: 60; flex-direction: column; }
        .page-header { display: flex; align-items: center; gap: 10px; padding: 15px; border-bottom: 1px solid var(--gold-border); background: var(--btn-blue-dark); flex-shrink: 0; }
        .page-header button { background: transparent; border: none; color: var(--gold-border); font-size: 18px; cursor: pointer; }
        .page-header h2 { color: var(--text-main); font-size: 16px; }
        .page-content { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; }

        .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 90; justify-content: center; align-items: center; }
        .modal-box { background: var(--card-bg); width: 90%; max-width: 320px; border-radius: 15px; border: 1px solid var(--gold-border); display: flex; flex-direction: column; overflow: hidden; max-height: 85vh; }
        .modal-header { background: var(--btn-blue-dark); padding: 15px; border-bottom: 1px solid var(--gold-border); text-align: center; }
        .modal-header h3 { color: var(--gold-border); font-size: 16px; }
        .modal-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .create-room-btn { background: var(--gold-border); color: #000; border: none; border-radius: 10px; padding: 10px; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div class="phone-container" id="phoneContainer">
        <div class="phone-inner" id="phoneInner">
            
            <div id="loadingScreen">
                <div class="spinner"></div>
                <div class="loading-text" id="loadingText">جاري التحقق...</div>
            </div>

            <div id="loginCard">
                <div class="title-container">
                    <div class="title-row">
                        <div class="glass-box box-chat"><div class="app-title">شـــات</div></div>
                        <div class="glass-box box-dardasha"><div class="app-title">ودردشـــة</div></div>
                    </div>
                    <div class="glass-box box-reema"><div class="app-title title-reema">ريـــمـــه</div></div>
                </div>
                <div class="top-icon"><i class="fas fa-comments"></i></div>
                
                <div class="bottom-section">
                    <div class="input-group"><i class="fas fa-envelope"></i><input type="email" id="loginEmail" placeholder="البريد الإلكتروني"></div>
                    <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="loginPassword" placeholder="كلمة المرور"></div>
                    
                    <div class="options">
                        <span></span> 
                        <a href="#" class="forgot-pass" onclick="resetAccountPassword()">نسيت كلمة المرور؟</a>
                    </div>

                    <button class="btn-main" id="loginBtn" onclick="loginUser()">تسجيل الدخول <i class="fas fa-paper-plane"></i></button>
                    <button class="btn-secondary" onclick="showRegister()">إنشاء حساب جديد <i class="fas fa-user-plus"></i></button>
                    
                    <div class="bottom-texts">
                        <div class="bottom-dua">اللهم صل على محمد</div>
                        <div class="developer-name">المطور: <span>حيدر فارع</span></div>
                        <div class="divider"><span>للتواصل والاقتراحات</span></div>
                        <a href="https://wa.me/967776250412" target="_blank" class="phone-number"><i class="fab fa-whatsapp whatsapp-icon"></i> +967776250412</a>
                    </div>
                </div>
            </div>

            <div id="registerCard">
                <div class="title-container">
                    <div class="title-row">
                        <div class="glass-box box-chat"><div class="app-title">تســـجـــيـــل</div></div>
                        <div class="glass-box box-dardasha"><div class="app-title">حـــســـاب</div></div>
                    </div>
                </div>
                <div class="top-icon"><i class="fas fa-user-plus"></i></div>
                <div class="bottom-section">
                    <div class="input-group"><i class="fas fa-user"></i><input type="text" id="regName" placeholder="الاسم (بدون مسافات)"></div>
                    <div class="input-group"><i class="fas fa-envelope"></i><input type="email" id="regEmail" placeholder="البريد الإلكتروني"></div>
                    <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="regPass" placeholder="كلمة السر"></div>
                    <button class="btn-main" id="registerBtn" onclick="registerUser()">تأكيد التسجيل <i class="fas fa-check"></i></button>
                    <button class="btn-secondary" onclick="showLogin()">لديك حساب؟ دخول <i class="fas fa-sign-in-alt"></i></button>
                </div>
            </div>

            <div id="mainApp">
                <div class="top-nav">
                    <div class="top-profile" onclick="openSideMenu()">
                        <div class="top-avatar" id="topAvatar"><i class="fas fa-user"></i></div>
                        <span class="top-name" id="topUserName">جاري التحميل...</span>
                    </div>
                    <i class="fas fa-bars menu-toggle" onclick="openSideMenu()"></i>
                </div>

                <div id="section-chats" class="app-section" style="display: flex;">
                    <div id="mainChatList" style="width: 100%;">
                        <div class="empty-state">لا توجد محادثات حالياً...</div>
                    </div>
                </div>

                <div class="bottom-nav" id="bottomNav" style="display: flex;">
                    <div class="nav-item active"><i class="fas fa-comment-dots"></i><span>دردشة</span></div>
                    <div class="nav-item" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i><span>خروج</span></div>
                </div>
            </div>

            <div id="menuOverlay" onclick="closeSideMenu()"></div>
            <div id="sideMenu">
                <div class="side-menu-header">
                    <div class="side-menu-avatar" id="sideMenuAvatar"><i class="fas fa-user"></i></div>
                    <div class="side-menu-info">
                        <h3 id="sideMenuName">جاري التحميل...</h3>
                        <p>أهلاً بك</p>
                    </div>
                </div>
                <div class="side-menu-list">
                    <div class="menu-item-side" onclick="logoutUser()"><i class="fas fa-sign-out-alt" style="color:var(--danger)"></i> تسجيل الخروج</div>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserSessionPersistence, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, set, get, update, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRRdm1GjZZBCumw2_w2X7ZUMkb6q1LvrU",
            authDomain: "chatrima.firebaseapp.com",
            databaseURL: "https://chatrima-default-rtdb.firebaseio.com",
            projectId: "chatrima",
            storageBucket: "chatrima.appspot.com",
            messagingSenderId: "1015405153719",
            appId: "1:1015405153719:web:68e090063d02b6622a2c32"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        setPersistence(auth, browserSessionPersistence).catch((error) => console.log(error));

        function showLoading(text) { document.getElementById('loadingScreen').style.display = 'flex'; document.getElementById('loadingText').innerText = text; }
        function hideLoading() { document.getElementById('loadingScreen').style.display = 'none'; }

        window.showRegister = function() { document.getElementById('loginCard').style.display = 'none'; document.getElementById('registerCard').style.display = 'flex'; }
        window.showLogin = function() { document.getElementById('registerCard').style.display = 'none'; document.getElementById('loginCard').style.display = 'flex'; }

        window.loginUser = function() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            if(!email || !password) return alert("أدخل البريد وكلمة المرور");
            showLoading("جاري الدخول...");
            signInWithEmailAndPassword(auth, email, password)
                .then(() => hideLoading())
                .catch(err => { 
                    hideLoading(); 
                    alert("خطأ في الدخول: تأكد من البريد وكلمة المرور"); 
                });
        }

        window.resetAccountPassword = function() {
            const email = document.getElementById('loginEmail').value.trim();
            if(!email) return alert("الرجاء كتابة بريدك الإلكتروني في خانة البريد أولاً.");
            showLoading("جاري الإرسال...");
            sendPasswordResetEmail(auth, email)
                .then(() => { hideLoading(); alert("✅ تم إرسال رابط استعادة كلمة المرور إلى بريدك."); })
                .catch((error) => { hideLoading(); alert("خطأ: " + error.message); });
        }

        window.registerUser = function() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPass').value;
            if(!name || !email || !password) return alert("أكمل البيانات");
            showLoading("جاري التسجيل...");
            createUserWithEmailAndPassword(auth, email, password).then((userCredential) => {
                set(ref(db, 'users/' + userCredential.user.uid), { 
                    name: name, email: email, status: 'online'
                }).then(() => hideLoading());
            }).catch(err => { hideLoading(); alert(err.message); });
        }

        window.logoutUser = function() {
            signOut(auth).then(() => { 
                closeSideMenu();
                document.getElementById('mainApp').style.display = 'none'; 
                document.getElementById('loginCard').style.display = 'flex'; 
            });
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('registerCard').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                loadUserProfile(user);
            } else {
                document.getElementById('mainApp').style.display = 'none';
                document.getElementById('loginCard').style.display = 'flex';
            }
        });

        function loadUserProfile(user) {
            get(ref(db, 'users/' + user.uid)).then((snapshot) => {
                let displayName = "";
                if (snapshot.exists()) {
                    displayName = snapshot.val().name; 
                }
                if(!displayName) displayName = user.email.split('@')[0];
                document.getElementById('topUserName').innerText = displayName;
                document.getElementById('sideMenuName').innerText = displayName;
            });
        }

        window.openSideMenu = function() { document.getElementById('sideMenu').classList.add('open'); document.getElementById('menuOverlay').style.display = 'block'; }
        window.closeSideMenu = function() { document.getElementById('sideMenu').classList.remove('open'); document.getElementById('menuOverlay').style.display = 'none'; }
    </script>
</body>
</html>
