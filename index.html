<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات ريمه - أبو جواس</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --card-bg: #0b1124; 
            --btn-blue-dark: #050a17; 
            --btn-blue-light: #101b3d; 
            --gold-border: #ff9900; 
            --gold-glow: rgba(255, 153, 0, 0.7); 
            --text-main: #e2e8f0; 
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none; 
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #0a1329 0%, #03050a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* التصميم الزجاجي والبروز */
        .phone-container {
            position: relative;
            width: 100%;
            max-width: 290px;
            margin: 0 auto;
            padding: 3px; 
            border-radius: 30px;
            background: conic-gradient(from 0deg, #ff9900, #a855f7, #06b6d4, #ff9900);
            animation: rotateLight 4s linear infinite;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9); 
        }

        @keyframes rotateLight {
            0% { background: conic-gradient(from 0deg, #ff9900, #a855f7, #06b6d4, #ff9900); }
            25% { background: conic-gradient(from 90deg, #ff9900, #a855f7, #06b6d4, #ff9900); }
            50% { background: conic-gradient(from 180deg, #ff9900, #a855f7, #06b6d4, #ff9900); }
            75% { background: conic-gradient(from 270deg, #ff9900, #a855f7, #06b6d4, #ff9900); }
            100% { background: conic-gradient(from 360deg, #ff9900, #a855f7, #06b6d4, #ff9900); }
        }

        .phone-inner {
            background: var(--card-bg);
            border-radius: 27px; 
            position: relative;
            z-index: 1;
            padding: 25px 15px 10px 15px;
            display: flex;
            flex-direction: column;
            min-height: 530px;
        }

        .side-btn {
            position: absolute;
            width: 6px;
            background: linear-gradient(90deg, #333, #111);
            border: 1px solid var(--gold-border);
            box-shadow: inset 0 0 5px rgba(255,153,0,0.5);
            border-radius: 3px;
            z-index: 10;
        }

        .power-btn {
            right: -6px; 
            top: 100px;
            height: 50px;
            background: linear-gradient(90deg, #ff4500, #8b0000);
            border-color: #ff4500;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.8);
            cursor: pointer;
        }

        .vol-up-btn { left: -6px; top: 90px; height: 40px; }
        .vol-down-btn { left: -6px; top: 135px; height: 40px; }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px; 
            margin-bottom: 20px; 
            width: 100%;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 6px; 
        }

        .glass-box {
            height: 32px; 
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, var(--btn-blue-light) 0%, var(--btn-blue-dark) 100%);
            border: 1px solid var(--gold-border); 
            box-shadow: 3px 3px 8px rgba(0,0,0,0.8), -1px -1px 3px rgba(255,255,255,0.1), 0 0 8px var(--gold-glow); 
        }

        .box-chat { flex: 1; border-radius: 20px 5px 20px 20px; }
        .box-dardasha { flex: 1; border-radius: 5px 20px 20px 20px; }
        .box-reema { width: 80%; border-radius: 20px 20px 20px 5px; }

        .app-title {
            font-family: 'Amiri', serif;
            font-size: 14px; 
            font-weight: 700;
            color: #ffffff; 
            margin: 0; 
            line-height: 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .title-reema {
            font-size: 16px; 
            letter-spacing: 1px; 
        }

        .top-icon {
            width: 75px; 
            height: 75px;
            border-radius: 50%; 
            background: var(--card-bg);
            margin: 0 auto 25px; 
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--gold-border); 
            box-shadow: 0 15px 25px rgba(0,0,0,0.9), 0 0 15px var(--gold-glow), inset 0 3px 8px rgba(255,255,255,0.4), inset 0 -3px 8px rgba(0,0,0,0.6);
            font-size: 30px; 
            color: var(--gold-border);
        }

        .bottom-section {
            margin-top: auto; 
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .input-group { 
            position: relative; 
            margin-bottom: 12px; 
        }
        
        .input-group i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-border); 
            font-size: 13px; 
            z-index: 2;
        }

        .input-group input {
            width: 100%;
            height: 38px; 
            padding: 0 35px 0 12px;
            border-radius: 20px 5px 20px 5px; 
            background: linear-gradient(180deg, var(--btn-blue-light) 0%, var(--btn-blue-dark) 100%);
            color: white;
            font-size: 11px; 
            font-weight: 700;
            border: 1px solid var(--gold-border); 
            box-shadow: 3px 3px 8px rgba(0,0,0,0.7), -1px -1px 4px rgba(255,255,255,0.1);
            outline: none;
        }

        .input-group input::placeholder { 
            color: #94a3b8; 
            font-weight: 600;
            font-size: 10px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px; 
            font-size: 9px; 
            color: var(--text-sub);
        }

        .checkbox-group { display: flex; align-items: center; gap: 4px; cursor: pointer; }
        .checkbox-group input[type="checkbox"] { width: 10px; height: 10px; accent-color: var(--gold-border); }
        .forgot-pass { color: #60a5fa; text-decoration: none; font-weight: 600; }

        .btn-main, .btn-secondary {
            width: 100%;
            height: 38px; 
            border-radius: 20px 5px 20px 5px; 
            background: linear-gradient(180deg, #1a2f66 0%, var(--btn-blue-dark) 100%); 
            color: white;
            font-size: 13px; 
            font-weight: 900;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--gold-border); 
            box-shadow: 0 10px 15px rgba(0,0,0,0.6), 0 5px 0 #02050d, 0 0 10px var(--gold-glow), inset 0 2px 5px rgba(255,255,255,0.3); 
            transition: all 0.1s ease; 
        }

        .btn-main i { color: var(--gold-border); font-size: 14px; }

        .btn-pressed {
            transform: translateY(5px); 
            box-shadow: 0 2px 5px rgba(0,0,0,0.4), 0 0px 0 #02050d, 0 0 5px var(--gold-glow) !important; 
        }

        .btn-secondary {
            height: 34px;
            font-size: 11px;
        }

        .bottom-texts {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5px;
        }

        .bottom-dua {
            color: #a78bfa;
            font-size: 10px;
            font-weight: 700;
            margin: 0 0 5px 0; 
            line-height: 1.1;
            position: relative;
            top: -2px; 
        }

        .developer-name {
            font-size: 9px;
            color: var(--text-sub);
            font-weight: 600;
            margin: 0; 
            line-height: 1.1;
        }
        .developer-name span { color: var(--gold-border); font-weight: bold; }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-sub);
            font-size: 8px;
            margin: 2px 0;
            font-weight: 600;
            width: 100%;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .divider span { padding: 0 5px; }

        .phone-number {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px; 
            font-size: 9px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0; 
            direction: ltr; 
            text-decoration: none; 
            line-height: 1.1;
        }

        .whatsapp-icon {
            color: #25D366; 
            font-size: 11px;
        }

        #registerCard { display: none; }
        #chatScreen { display: none; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="side-btn power-btn"></div>
        <div class="side-btn vol-up-btn"></div>
        <div class="side-btn vol-down-btn"></div>

        <div class="phone-inner">
            
            <!-- 1. صفحة تسجيل الدخول -->
            <div id="loginCard" style="display: flex; flex-direction: column; width: 100%; height: 100%;">
                
                <div class="title-container">
                    <div class="title-row">
                        <div class="glass-box box-chat"><div class="app-title">شـــات</div></div>
                        <div class="glass-box box-dardasha"><div class="app-title">ودردشـــة</div></div>
                    </div>
                    <div class="glass-box box-reema"><div class="app-title title-reema">ريـــمـــه</div></div>
                </div>

                <div class="top-icon"><i class="fas fa-user"></i></div>

                <div class="bottom-section">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="كلمة المرور">
                    </div>

                    <div class="options">
                        <label class="checkbox-group"><input type="checkbox"> تذكرني</label>
                        <a href="#" class="forgot-pass">نسيت كلمة المرور؟</a>
                    </div>

                    <button class="btn-main" onmousedown="pressEffect(this)" ontouchstart="pressEffect(this)" onclick="loginUser()">
                        تسجيل الدخول <i class="fas fa-paper-plane"></i>
                    </button>

                    <button class="btn-secondary" onmousedown="pressEffect(this)" ontouchstart="pressEffect(this)" onclick="showRegister()">
                        إنشاء حساب جديد <i class="fas fa-user-plus"></i>
                    </button>

                    <div class="bottom-texts">
                        <div class="bottom-dua">اللهم صل على محمد</div>
                        <div class="developer-name">المطور: <span>حيدر فارع</span></div>
                        <div class="divider"><span>للتواصل والاقتراحات</span></div>
                        <a href="https://wa.me/967776250412" target="_blank" class="phone-number"><i class="fab fa-whatsapp whatsapp-icon"></i> +967776250412</a>
                    </div>
                </div>
            </div>

            <!-- 2. صفحة إنشاء حساب جديد -->
            <div id="registerCard" style="flex-direction: column; width: 100%; height: 100%;">
                
                <div class="title-container">
                    <div class="title-row">
                        <div class="glass-box box-chat"><div class="app-title">تســـجـــيـــل</div></div>
                        <div class="glass-box box-dardasha"><div class="app-title">حـــســـاب</div></div>
                    </div>
                </div>

                <div class="top-icon"><i class="fas fa-user-plus"></i></div>

                <div class="bottom-section">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="regName" placeholder="الاسم (بدون مسافات)">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="البريد الإلكتروني">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="regPass" placeholder="كلمة السر (6 حروف/أرقام+)">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-globe"></i>
                        <input type="text" id="regCountry" placeholder="البلد">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-calendar-alt"></i>
                        <input type="number" id="regAge" placeholder="العمر">
                    </div>

                    <button class="btn-main" onmousedown="pressEffect(this)" ontouchstart="pressEffect(this)" onclick="registerUser()">
                        تأكيد التسجيل <i class="fas fa-check"></i>
                    </button>

                    <button class="btn-secondary" onmousedown="pressEffect(this)" ontouchstart="pressEffect(this)" onclick="showLogin()">
                        لديك حساب؟ دخول <i class="fas fa-sign-in-alt"></i>
                    </button>
                    
                    <div class="bottom-texts">
                        <div class="bottom-dua">اللهم صل على محمد</div>
                        <div class="developer-name">المطور: <span>حيدر فارع</span></div>
                    </div>
                </div>
            </div>

            <!-- 3. واجهة الدردشة -->
            <div id="chatScreen" style="display: none; flex-direction: column; width: 100%; height: 100%;">
                <div class="title-container">
                    <div class="title-row">
                        <div class="glass-box box-chat"><div class="app-title">شـــات</div></div>
                        <div class="glass-box box-dardasha"><div class="app-title">ودردشـــة</div></div>
                    </div>
                    <div class="glass-box box-reema"><div class="app-title title-reema">ريـــمـــه</div></div>
                </div>

                <div class="top-icon"><i class="fas fa-comments"></i></div>
                
                <div class="bottom-section" style="justify-content: center; align-items: center;">
                    <h2 id="welcomeUser" style="color: var(--text-main); font-size: 13px; margin-bottom: 15px;">أهلاً بك 👑</h2>
                    <button class="btn-main" style="width: 100%;" onmousedown="pressEffect(this)" ontouchstart="pressEffect(this)" onclick="logoutUser()">خروج</button>
                </div>
            </div>
            
        </div>
    </div>

    <!-- كود Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyDRRdm1GjZZBCumw2_w2X7ZUMkb6q1LvrU",
            authDomain: "chatrima.firebaseapp.com",
            databaseURL: "https://chatrima-default-rtdb.firebaseio.com",
            projectId: "chatrima",
            storageBucket: "chatrima.firebasestorage.app",
            messagingSenderId: "1015405153719",
            appId: "1:1015405153719:web:68e090063d02b6622a2c32",
            measurementId: "G-KDBBTEPHJ5"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // --- دالة إنشاء حساب ---
        window.registerUser = function() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;
            const country = document.getElementById('regCountry').value.trim();
            const age = document.getElementById('regAge').value.trim();

            if (name === "" || name.includes(' ')) {
                alert("الاسم مطلوب وبدون مسافات."); return;
            }
            if (email === "" || pass === "" || country === "" || age === "") {
                alert("الرجاء ملء جميع الحقول."); return;
            }
            if (pass.length < 6) {
                alert("كلمة السر يجب أن تكون 6 حروف أو أرقام على الأقل."); return;
            }

            createUserWithEmailAndPassword(auth, email, pass)
            .then((userCredential) => {
                const user = userCredential.user;
                set(ref(db, 'users/' + user.uid), {
                    username: name,
                    email: email,
                    country: country,
                    age: age,
                    createdAt: Date.now()
                }).then(() => {
                    alert("تم إنشاء حسابك بنجاح!");
                    showLogin();
                });
            })
            .catch((error) => {
                alert("خطأ: " + error.message);
            });
        };

        // --- دالة تسجيل الدخول ---
        window.loginUser = function() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;

            if (email === "" || pass === "") {
                alert("الرجاء إدخال البريد وكلمة المرور."); return;
            }

            signInWithEmailAndPassword(auth, email, pass)
            .then((userCredential) => {
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('chatScreen').style.display = 'flex';
            })
            .catch((error) => {
                alert("خطأ في الدخول: تأكد من البريد وكلمة المرور.");
            });
        };

        // --- دالة تسجيل الخروج ---
        window.logoutUser = function() {
            signOut(auth).then(() => {
                document.getElementById('chatScreen').style.display = 'none';
                document.getElementById('loginCard').style.display = 'flex';
                document.getElementById('loginEmail').value = '';
                document.getElementById('loginPassword').value = '';
            });
        };

        // مراقبة حالة الدخول
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('chatScreen').style.display = 'flex';
                document.getElementById('welcomeUser').innerText = "أهلاً بك " + user.email + " 👑";
            } else {
                document.getElementById('loginCard').style.display = 'flex';
                document.getElementById('chatScreen').style.display = 'none';
            }
        });

        window.showRegister = function() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('registerCard').style.display = 'flex';
        };
        window.showLogin = function() {
            document.getElementById('registerCard').style.display = 'none';
            document.getElementById('loginCard').style.display = 'flex';
        };

        window.pressEffect = function(btn) {
            btn.classList.add('btn-pressed');
            setTimeout(function() {
                btn.classList.remove('btn-pressed');
            }, 400); 
        }
    </script>
</body>
</html>
